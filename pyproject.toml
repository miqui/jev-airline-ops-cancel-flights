[project]
name = "jev-ops"
version = "0.1.0"
description = "Flight cancellation decisions via TypeSafe's Jev model (OpenRouter Decisions API)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.7.22",
]

[project.scripts]
jev-ops = "jev_ops.cli:main"

[dependency-groups]
dev = ["ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_ops"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
